name: Floor heating thermostat
products:
  - id: 7uerfkkqyp5sqxhi
    manufacturer: Magnum
    model: S28
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: AUTO
            value: program
          - dps_val: MANUAL
            value: manual
          - dps_val: HOLIDAY
            value: away
          - dps_val: FROST
            value: frost_protection
          - dps_val: SLOW
            value: slow_start
          - dps_val: BOOST
            value: boost
      - id: 3
        type: string
        name: hvac_action
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: warming
            value: idle
      - id: 16
        type: integer
        name: temperature
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10
            step: 5
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 107
        type: boolean
        name: temperature_unit
        mapping:
          - dps_val: true
            value: F
          - value: C
  - entity: sensor
    # Reports whichever probe is selected by the sensor mode
    class: temperature
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 104
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 104
        type: bitfield
        name: fault_code
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 108
        type: boolean
        name: lock
  - entity: select
    name: Sensor mode
    icon: "mdi:thermometer-lines"
    category: config
    dps:
      - id: 111
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: Room
          - dps_val: "1"
            value: Floor
          - dps_val: "2"
            value: Room with floor limit
  - entity: select
    name: Sensor type
    icon: "mdi:thermometer-probe"
    category: config
    dps:
      - id: 125
        type: string
        name: option
        mapping:
          - dps_val: "3950_10k"
            value: "3950 10k"
          - dps_val: "3380_10k"
            value: "3380 10k"
          - dps_val: "3700_10k"
            value: "3700 10k"
          - dps_val: "3600_12k"
            value: "3600 12k"
          - dps_val: "3750_15k"
            value: "3750 15k"
          - dps_val: "3740_12k"
            value: "3740 12k"
  - entity: number
    translation_key: temperature_calibration
    category: config
    dps:
      - id: 112
        type: integer
        name: value
        unit: C
        range:
          min: -90
          max: 90
        mapping:
          - scale: 10
  - entity: number
    name: Floor temperature calibration
    icon: "mdi:thermometer-lines"
    category: config
    dps:
      - id: 113
        type: integer
        name: value
        optional: true
        unit: C
        range:
          min: -90
          max: 90
        mapping:
          - scale: 10
  - entity: select
    name: Temperature hysteresis
    icon: "mdi:thermometer-chevron-up"
    category: config
    dps:
      - id: 114
        type: integer
        name: option
        mapping:
          - dps_val: 5
            value: "0.5°C"
          - dps_val: 10
            value: "1.0°C"
          - dps_val: 15
            value: "1.5°C"
          - dps_val: 20
            value: "2.0°C"
  - entity: select
    name: Control accuracy
    icon: "mdi:target"
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "0.1°C"
          - dps_val: "1"
            value: "0.5°C"
          - dps_val: "2"
            value: "1.0°C"
  - entity: number
    name: Setback
    icon: "mdi:weather-night"
    category: config
    dps:
      - id: 103
        type: integer
        name: value
        range:
          min: 2
          max: 8
  - entity: switch
    name: Open window detection
    icon: "mdi:window-open-variant"
    category: config
    dps:
      - id: 127
        type: boolean
        name: switch
  - entity: switch
    name: Intelligence
    icon: "mdi:brain"
    category: config
    dps:
      - id: 126
        type: boolean
        name: switch
  - entity: select
    name: Program mode
    icon: "mdi:calendar-week"
    category: config
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: "7"
            value: "7 days"
          - dps_val: "24"
            value: "24"
          - dps_val: "511"
            value: "5+1+1"
  - entity: select
    name: Program periods
    icon: "mdi:calendar-clock"
    category: config
    dps:
      - id: 110
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
  - entity: number
    name: Holiday length
    class: duration
    icon: "mdi:island"
    category: config
    dps:
      - id: 109
        type: integer
        name: value
        unit: d
        range:
          min: 0
          max: 99
  - entity: select
    name: Floor covering
    icon: "mdi:floor-plan"
    category: config
    dps:
      - id: 124
        type: string
        name: option
        mapping:
          - dps_val: wood
            value: Wood
          - dps_val: other
            value: Other
  - entity: number
    name: Heater power
    class: power
    icon: "mdi:flash"
    category: config
    dps:
      - id: 116
        type: integer
        name: value
        unit: W
        range:
          min: 0
          max: 3600
  - entity: number
    name: Energy price
    icon: "mdi:cash"
    category: config
    dps:
      - id: 118
        type: integer
        name: value
        range:
          min: 1
          max: 99
        mapping:
          - scale: 10
  - entity: sensor
    name: Consumption
    category: diagnostic
    dps:
      - id: 123
        type: integer
        name: sensor
  - entity: number
    name: Display brightness
    icon: "mdi:brightness-6"
    category: config
    dps:
      - id: 115
        type: integer
        name: value
        range:
          min: 1
          max: 10
  - entity: number
    name: Backlight timeout
    class: duration
    icon: "mdi:timer-outline"
    category: config
    dps:
      - id: 117
        type: integer
        name: value
        unit: s
        range:
          min: 5
          max: 60
  - entity: select
    name: Night display
    icon: "mdi:monitor-star"
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: time_date_temp
            value: Time, date and temperature
          - dps_val: time_temp
            value: Time and temperature
          - dps_val: time_only
            value: Time only
  - entity: select
    name: Theme
    icon: "mdi:palette"
    category: config
    dps:
      - id: 131
        type: string
        name: option
        mapping:
          - dps_val: White
            value: White
          - dps_val: Black
            value: Black
